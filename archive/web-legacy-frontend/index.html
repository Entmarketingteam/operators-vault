<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operators Vault – Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/vault.css">
</head>
<body>
  <div class="vault-app">
    <header class="vault-header">
      <div class="vault-header-inner">
        <a href="/" class="vault-logo" id="vault-logo">Operators <span>Vault</span></a>
        <nav class="vault-nav" style="display:flex; gap:1rem; align-items:center;" id="vault-nav">
          <a href="/" style="color:inherit; text-decoration:none; font-weight:500;">Discover</a>
          <a href="#" data-route="insights-ui" style="color:inherit; text-decoration:none;">Listen</a>
          <a href="#" data-route="episodes-ui" style="color:inherit; text-decoration:none;">Catalog</a>
          <a href="#" data-route="people-ui" style="color:inherit; text-decoration:none;">People</a>
          <a href="#" data-route="ask-ui" style="color:inherit; text-decoration:none;">Ask</a>
          <a href="#" data-route="docs" style="color:inherit; text-decoration:none;">API</a>
        </nav>
        <div class="vault-auth" id="vault-auth-state">
          <div id="vault-sign-in">
            <button type="button" class="vault-btn vault-btn-primary" onclick="window.VaultAuth && window.VaultAuth.signInWithGoogle()">Sign in with Google</button>
            <span class="vault-auth-or">or</span>
            <input type="email" id="vault-magic-email" placeholder="Email for magic link" style="width:180px; padding:0.5rem 0.75rem; border:1px solid var(--vault-border); border-radius:6px;">
            <button type="button" class="vault-btn vault-btn-secondary" onclick="var e=document.getElementById('vault-magic-email'); window.VaultAuth && window.VaultAuth.signInWithMagicLink(e && e.value).then(function(){ alert('Check your email for the sign-in link.'); }).catch(function(err){ alert(err.message || 'Failed'); });">Send magic link</button>
          </div>
          <div id="vault-signed-in" style="display:none;"><span class="vault-signed-in-email" id="vault-signed-in-email"></span> <button type="button" class="vault-btn vault-btn-secondary vault-btn-sm" onclick="window.VaultAuth && window.VaultAuth.signOut()">Sign out</button> <button type="button" class="vault-btn vault-btn-primary" onclick="document.getElementById('vault-search-form').requestSubmit()">Search</button></div>
          <div class="token-wrap" id="vault-token-wrap" style="display:none;">
            <input type="password" id="token" placeholder="Paste token (advanced)" title="Supabase access token" autocomplete="off" style="width:180px;">
            <button type="button" class="vault-btn vault-btn-primary" onclick="document.getElementById('vault-search-form').requestSubmit()">Search</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="vault-hero">
        <h1>Search Operators Vault</h1>
        <p class="subtitle">Explore insights and moments from 9 Operators, Marketing Operator, Finance Operator, and TITANS.</p>
        <div class="vault-shortcuts" style="margin-bottom:0.75rem;">
          <span style="margin-right:0.5rem;">Show:</span>
          <button type="button" class="vault-btn vault-btn-secondary vault-btn-sm" onclick="document.getElementById('podcast').value=''; document.getElementById('vault-search-form').requestSubmit();">All</button>
          <button type="button" class="vault-btn vault-btn-secondary vault-btn-sm" onclick="document.getElementById('podcast').value='titans'; document.getElementById('vault-search-form').requestSubmit();">TITANS</button>
        </div>
        <form id="vault-search-form" onsubmit="event.preventDefault(); window.VaultSearch();">
          <div class="vault-search-bar">
            <input type="search" name="q" placeholder="Try 'pricing' or 'framework'…" autofocus aria-label="Search">
            <button type="submit" class="vault-btn vault-btn-primary">Search</button>
          </div>
          <div class="vault-filters">
            <label for="podcast">Podcast</label>
            <select id="podcast" name="podcast">
              <option value="">All</option>
              <option value="9operators">9 Operators</option>
              <option value="marketing_operator">Marketing Operator</option>
              <option value="finance_operators">Finance Operators</option>
              <option value="titans">TITANS</option>
            </select>
            <label for="type_">Type</label>
            <select id="type_" name="type_">
              <option value="insights">Insights</option>
              <option value="moments">Moments</option>
              <option value="all">All</option>
            </select>
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">Any</option>
              <option value="Frameworks and exercises">Frameworks and exercises</option>
              <option value="Points of view">Points of view</option>
              <option value="Business ideas">Business ideas</option>
              <option value="Stories and anecdotes">Stories and anecdotes</option>
              <option value="Quotes">Quotes</option>
              <option value="Products">Products</option>
            </select>
            <label for="limit">Limit</label>
            <input type="number" id="limit" name="limit" value="20" min="1" max="100" style="width:4rem; padding:0.5rem; border:1px solid var(--vault-border); border-radius:6px;">
          </div>
        </form>
      </section>

      <div id="vault-results">
        <p class="vault-empty">Sign in above, then run a search.</p>
      </div>
    </main>

    <footer class="vault-footer">
      Private vault · <a href="#" data-route="search-ui">Search</a> · <a href="#" data-route="episodes-ui">Episodes</a> · <a href="#" data-route="insights-ui">Listen</a> · <a href="#" data-route="ask-ui">Ask</a> · <a href="#" data-route="docs" target="_blank" rel="noopener">API</a>
    </footer>
  </div>
  <script>
    window.VaultConfig = {
      apiBase: "https://superb-smile-production.up.railway.app",
      supabaseUrl: "https://wbdwnlzbgugewtmvahwg.supabase.co",
      supabaseAnonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndiZHdubHpiZ3VnZXd0bXZhaHdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5Mzc0MzIsImV4cCI6MjA4NDUxMzQzMn0.8cW9UoDzsCzv8_JHU0imeY8NpOdF5e2XAE_Gxq6O_cs"
    };
    (function () {
      var base = window.VaultConfig && window.VaultConfig.apiBase ? window.VaultConfig.apiBase.replace(/\/$/, '') : '';
      function applyNav() {
        [].slice.call(document.querySelectorAll('[data-route]')).forEach(function (a) {
          var r = a.getAttribute('data-route');
          if (r === 'docs') a.href = base + '/docs'; else a.href = base + '/' + r;
          if (r !== 'docs') a.removeAttribute('target');
        });
        var logo = document.getElementById('vault-logo');
        if (logo) logo.href = base ? base + '/search-ui' : '/';
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyNav); else applyNav();
    })();
  </script>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    window.createSupabaseClient = function (url, key) { return Promise.resolve(createClient(url, key)); };
  </script>
  <script src="/js/auth.js"></script>
  <script src="/js/vault.js"></script>
</body>
</html>
