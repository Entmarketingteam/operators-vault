<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operators Vault – People</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ static_prefix }}/css/vault.css">
</head>
<body>
  <div class="vault-app">
    <header class="vault-header">
      <div class="vault-header-inner">
        <a href="/search-ui" class="vault-logo">Operators <span>Vault</span></a>
        <nav class="vault-nav" style="display:flex; gap:1rem; align-items:center;">
          <a href="/search-ui">Discover</a>
          <a href="/insights-ui">Listen</a>
          <a href="/episodes-ui">Catalog</a>
          <a href="/people-ui" style="font-weight:500;">People</a>
          <a href="/ask-ui">Ask</a>
          <a href="/docs" target="_blank" rel="noopener">API</a>
        </nav>
        <div class="vault-auth">
          <div class="token-wrap">
            <input type="password" id="token" placeholder="Paste token" autocomplete="off">
            <button type="button" class="vault-btn vault-btn-primary" onclick="window.VaultPeople && window.VaultPeople.load()">Load</button>
          </div>
        </div>
      </div>
    </header>
    <main>
      <section class="vault-hero">
        <h1>People</h1>
        <p class="subtitle">Hosts and guests from the Operators network.</p>
      </section>
      <div id="vault-people"><p class="vault-empty">Paste your token and click Load.</p></div>
    </main>
    <footer class="vault-footer">Private vault · <a href="/search-ui">Search</a> · <a href="/docs">Docs</a></footer>
  </div>
  <script>window.VaultConfig = { apiBase: "{{ api_base }}" };</script>
  <script src="{{ static_prefix }}/js/people.js"></script>
</body>
</html>
