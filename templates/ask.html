<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operators Vault – Ask</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ static_prefix }}/css/vault.css">
</head>
<body>
  <div class="vault-app">
    <header class="vault-header">
      <div class="vault-header-inner">
        <a href="/search-ui" class="vault-logo">Operators <span>Vault</span></a>
        <nav class="vault-nav" style="display:flex; gap:1rem; align-items:center;">
          <a href="/search-ui">Discover</a>
          <a href="/insights-ui">Listen</a>
          <a href="/episodes-ui">Catalog</a>
          <a href="/people-ui">People</a>
          <a href="/ask-ui" style="font-weight:500;">Ask</a>
          <a href="/docs" target="_blank" rel="noopener">API</a>
        </nav>
        <div class="vault-auth">
          <div class="token-wrap">
            <input type="password" id="token" placeholder="Paste token" autocomplete="off">
          </div>
        </div>
      </div>
    </header>
    <main>
      <section class="vault-hero">
        <h1>Ask Operators Vault</h1>
        <p class="subtitle">Ask questions about the podcasts. Answers are based on vault excerpts and cite episodes.</p>
      </section>
      <div id="vault-chat" style="max-width:720px; margin:0 auto 2rem;">
        <div id="vault-chat-messages"></div>
        <form id="vault-chat-form" style="display:flex; gap:0.5rem; margin-top:1rem;" onsubmit="event.preventDefault(); window.VaultAsk && window.VaultAsk.send();">
          <input type="text" id="vault-chat-input" placeholder="Ask anything about the vault…" style="flex:1; padding:0.75rem; border:1px solid var(--vault-border); border-radius:8px;">
          <button type="submit" class="vault-btn vault-btn-primary">Send</button>
        </form>
        <p id="vault-chat-error" class="vault-err" style="display:none; margin-top:0.5rem;"></p>
      </div>
    </main>
    <footer class="vault-footer">Private vault · <a href="/search-ui">Search</a> · <a href="/docs">Docs</a></footer>
  </div>
  <script>window.VaultConfig = { apiBase: "{{ api_base }}" };</script>
  <script src="{{ static_prefix }}/js/ask.js"></script>
</body>
</html>
